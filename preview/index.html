<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可樂 · 门店会员小程序界面预览</title>
<style>
  :root {
    --brand: #171717; --brand-deep: #262626; --brand-soft: #F4F4F4; --brand-line: #DEDEDE;
    --gold: #525252; --gold-soft: #F5F5F5;
    --bg: #FFFFFF; --card: #FFFFFF;
    --ink: #171717; --ink-2: #737373; --ink-3: #8A8A8A; --line: #EAEAEA;
    --ok: #4CAF7D; --ok-soft: #E9F5EF; --warn: #E8834A; --warn-soft: #FDF0E6;
    --bad: #E05A5A; --bad-soft: #FBEAEA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #1C181A; color: #E8E0DC;
    display: flex; min-height: 100vh; gap: 0;
  }
  /* ===== 侧栏 ===== */
  aside {
    width: 232px; flex-shrink: 0; padding: 28px 18px;
    border-right: 1px solid #2E272A; overflow-y: auto; height: 100vh;
    position: sticky; top: 0;
  }
  aside h1 { font-size: 17px; letter-spacing: 2px; color: #fff; }
  aside .sub { font-size: 12px; color: #8D8184; margin: 6px 0 22px; }
  aside .group { font-size: 11px; color: #7A6E71; letter-spacing: 2px; margin: 18px 0 8px; }
  aside button {
    display: block; width: 100%; text-align: left;
    background: none; border: none; color: #C9BDB9;
    font-size: 13px; padding: 8px 12px; border-radius: 8px; cursor: pointer;
  }
  aside button:hover { background: #2A2426; color: #fff; }
  aside button.active { background: var(--brand); color: #fff; font-weight: 600; }
  /* ===== 主区 ===== */
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .screen-title { font-size: 14px; color: #9A8D90; letter-spacing: 1px; }
  /* 手机框 */
  .phone {
    width: 390px; height: 812px; border-radius: 46px;
    border: 10px solid #000; background: var(--bg);
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px #3A3235;
    overflow: hidden; position: relative;
  }
  .statusbar {
    height: 44px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px; font-size: 13px; font-weight: 600; color: var(--ink);
    background: var(--bg);
  }
  .screen-body { height: 724px; overflow-y: auto; scrollbar-width: none; }
  .screen-body::-webkit-scrollbar { display: none; }
  /* ===== 小程序内样式（与 app.wxss 同源） ===== */
  .screen-body { font-size: 14px; line-height: 1.55; color: var(--ink); }
  .page { padding: 12px 16px 32px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; box-shadow: 0 3px 12px rgba(122,80,80,.05); }
  .card + .card { margin-top: 12px; }
  .section { margin-top: 16px; }
  .section-title { display: flex; justify-content: space-between; align-items: center; margin: 0 2px 10px; font-size: 16px; font-weight: 600; }
  .section-title .more { font-size: 12px; font-weight: 400; color: var(--ink-3); }
  .row { display: flex; align-items: center; }
  .row-between { display: flex; align-items: center; justify-content: space-between; }
  .col { display: flex; flex-direction: column; }
  .flex-1 { flex: 1; min-width: 0; }
  .ellipsis { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .t-title { font-size: 16px; font-weight: 600; }
  .t-sub { font-size: 12px; color: var(--ink-2); }
  .t-tip { font-size: 11px; color: var(--ink-3); }
  .t-brand { color: var(--brand); } .t-gold { color: var(--gold); }
  .t-ok { color: var(--ok); } .t-bad { color: var(--bad); }
  .t-num { font-family: "DIN Alternate", -apple-system, sans-serif; font-weight: 600; }
  .price { color: var(--brand); font-weight: 600; }
  .price .unit { font-size: 11px; font-weight: 400; }
  .ic { width: 20px; height: 20px; flex-shrink: 0; }
  .ic-sm { width: 16px; height: 16px; flex-shrink: 0; }
  .ic-lg { width: 26px; height: 26px; flex-shrink: 0; }
  .ic-badge { width: 36px; height: 36px; border-radius: 11px; background: var(--brand-soft); display: flex; align-items: center; justify-content: center; color: var(--brand); flex-shrink: 0; }
  .ic-badge.gold { background: var(--gold-soft); color: var(--gold); }
  .ic-badge.sm { width: 30px; height: 30px; border-radius: 9px; }
  .btn { display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 5px 12px rgba(183,110,121,.32); }
  .btn-ghost { background: #fff; color: var(--brand); border: 1px solid var(--brand-line); }
  .btn-soft { background: var(--brand-soft); color: var(--brand-deep); }
  .btn-block { width: 100%; }
  .btn-mini { display: inline-flex; align-items: center; height: 28px; padding: 0 13px; border-radius: 15px; font-size: 12px; background: var(--brand-soft); color: var(--brand-deep); }
  .btn-mini.primary { background: var(--brand); color: #fff; }
  .btn-mini.line { background: #fff; border: 1px solid var(--line); color: var(--ink-2); }
  .cell { display: flex; align-items: center; padding: 14px 2px; border-bottom: 1px solid var(--line); }
  .cell:last-child { border-bottom: none; }
  .cell-title { flex: 1; font-size: 15px; margin-left: 12px; }
  .cell-desc { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .cell-arrow { width: 16px; height: 16px; opacity: .45; }
  .tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 5px; font-size: 10px; font-weight: 500; background: var(--brand-soft); color: var(--brand-deep); flex-shrink: 0; }
  .tag.gold { background: var(--gold-soft); color: #525252; }
  .tag.ok { background: var(--ok-soft); color: #34885D; }
  .tag.warn { background: var(--warn-soft); color: #C06428; }
  .tag.bad { background: var(--bad-soft); color: #C24B4B; }
  .tag.gray { background: #F3F3F3; color: var(--ink-2); }
  .tabs { display: flex; gap: 8px; }
  .tab { height: 32px; padding: 0 14px; border-radius: 16px; display: flex; align-items: center; font-size: 13px; background: #fff; color: var(--ink-2); border: 1px solid var(--line); cursor: pointer; }
  .tab.active { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  .form-item { display: flex; align-items: center; min-height: 50px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .form-item:last-child { border-bottom: none; }
  .form-label { width: 90px; color: var(--ink-2); flex-shrink: 0; }
  .form-value { flex: 1; }
  .form-placeholder { color: var(--ink-3); }
  .divider { height: 1px; background: var(--line); margin: 12px 0; }
  .empty { padding: 40px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--ink-3); font-size: 13px; }
  .empty .ic { width: 44px; height: 44px; opacity: .35; }
  /* 参考图 */
  .pics-row { display: flex; gap: 8px; margin-top: 10px; }
  .pic-box { width: 76px; height: 76px; border-radius: 8px; background: var(--brand-soft); }
  .pic-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--brand); }
  .pic-add {
    width: 76px; height: 76px; border-radius: 8px; background: #F8F4F1;
    border: 1px dashed #D9CCC7; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--ink-3);
  }
  .pic-add .pic-add-ic { width: 20px; height: 20px; }
  .pic-add-txt { font-size: 11px; color: var(--ink-3); }
  /* tabBar */
  .tabbar { display: flex; justify-content: center; padding: 0 14px 16px; background: transparent; }
  .dockbar {
    max-width: 100%;
    display: flex; align-items: center; gap: 4px; padding: 6px 9px; border-radius: 22px;
    background: rgba(255,255,255,.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.8);
    box-shadow: 0 8px 20px rgba(44,37,40,.14), 0 1px 4px rgba(44,37,40,.06);
    animation: dockFloat 4s ease-in-out infinite;
  }
  @keyframes dockFloat { 0%,100% { transform: translateY(-2px) } 50% { transform: translateY(2px) } }
  .tabbar-item { position: relative; display: flex; align-items: center; padding: 7px 13px; border-radius: 18px; cursor: pointer; transition: transform .28s cubic-bezier(.34,1.56,.64,1), background-color .28s ease; }
  .tabbar-item:hover { transform: scale(1.1) translateY(-2px); }
  .tabbar-item:active { transform: scale(.95); }
  .tabbar-item.active { background: var(--brand-soft); transform: scale(1.06); }
  .tabbar-item .lb { font-size: 11px; font-weight: 600; color: var(--brand); white-space: nowrap; overflow: hidden; max-width: 0; opacity: 0; transition: max-width .28s ease, opacity .22s ease, margin-left .28s ease; }
  .tabbar-item.active .lb { max-width: 60px; opacity: 1; margin-left: 6px; }
  .tabbar-item .tip {
    position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%) translateY(6px) scale(.9); transform-origin: bottom center; opacity: 0;
    padding: 4px 10px; border-radius: 10px; font-size: 10px; color: #fff; background: rgba(44,37,40,.88);
    white-space: nowrap; pointer-events: none;
    transition: opacity .22s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
  }
  .tabbar-item:hover .tip { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  .tabbar-item .tip::after { content: ''; position: absolute; top: 100%; left: 50%; margin-left: -4px; border: 4px solid transparent; border-top-color: rgba(44,37,40,.88); }
  /* 首页 */
  .hero { border-radius: 14px; padding: 20px 18px; background: linear-gradient(135deg,#333333 0%,#171717 55%,#262626 100%); color: #fff; box-shadow: 0 7px 16px rgba(0,0,0,.28); position: relative; overflow: hidden; }
  .hero-bg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero-mask { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.2) 60%, rgba(0,0,0,.45) 100%); }
  .hero > *:not(.hero-bg):not(.hero-mask) { position: relative; }
  .hero::after { content: ''; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .hero-name { font-size: 26px; font-weight: 700; letter-spacing: 4px; }
  .hero-slogan { font-size: 12px; opacity: .85; margin-top: 4px; }
  .hero-logo { width: 54px; height: 54px; border-radius: 16px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; }
  .hero-meta { margin-top: 14px; display: flex; flex-wrap: wrap; }
  .hero-meta-item { font-size: 11px; opacity: .92; background: rgba(255,255,255,.14); border-radius: 12px; padding: 4px 10px; margin: 0 6px 5px 0; display: flex; align-items: center; gap: 4px; }
  .hero-actions { margin-top: 16px; gap: 10px; }
  .hero-btn { flex: 1; height: 38px; border-radius: 19px; background: #fff; color: var(--brand-deep); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; cursor: pointer; }
  .hero-btn.ghost { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.5); color: #fff; }
  .lottery-tip { margin-top: 12px; height: 44px; border-radius: 22px; background: linear-gradient(90deg,#525252,#333333); color: #fff; font-size: 13px; font-weight: 500; padding: 0 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 5px 12px rgba(185,139,69,.35); cursor: pointer; }
  .quick { margin-top: 12px; display: flex; flex-wrap: wrap; padding: 16px 6px 8px; }
  .quick-item { width: 25%; display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--ink-2); margin-bottom: 14px; gap: 6px; cursor: pointer; }
  .svc-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .svc-item { width: calc(50% - 5px); padding: 0 0 10px; overflow: hidden; cursor: pointer; }
  .svc-cover { width: 100%; height: 96px; background: linear-gradient(135deg,#F4F4F4,#EAEAEA); display: flex; align-items: center; justify-content: center; color: var(--brand); overflow: hidden; }
  /* 图片占位（真实图到位后替换） */
  .img-ph { position: relative; width: 100%; height: 100%; background: linear-gradient(150deg, #F3E4E6 0%, #EBD4D7 55%, #E2C4C8 100%); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .img-ph span { font-family: Georgia, serif; font-size: 22px; letter-spacing: 4px; color: rgba(0,0,0,.22); font-weight: 700; }
  .img-ph.full { position: absolute; left: 0; top: 0; }
  .img-ph.full span { font-size: 15px; }
  .hero .img-ph { background: linear-gradient(160deg, #333333 0%, #262626 68%, #7E4450 100%); }
  .hero .img-ph span { color: rgba(255,255,255,.12); font-size: 15px; }
  .svc-cover img { width: 100%; height: 100%; object-fit: cover; }
  .svc-name { font-size: 14px; font-weight: 600; padding: 9px 10px 4px; }
  .pool-tip { font-size: 12px; color: var(--ink-2); background: var(--gold-soft); border-radius: 8px; padding: 8px 10px; margin-bottom: 4px; }
  .pool-item { padding: 11px 0; border-bottom: 1px solid var(--line); }
  .pool-item:last-child { border-bottom: none; }
  .pool-name { font-size: 14px; margin-right: 8px; }
  /* 服务 */
  .svc-row { display: flex; padding: 12px; cursor: pointer; }
  .svc-img { width: 90px; height: 90px; border-radius: 10px; background: linear-gradient(135deg,#F4F4F4,#EAEAEA); display: flex; align-items: center; justify-content: center; color: var(--brand); flex-shrink: 0; overflow: hidden; }
  .svc-img img { width: 100%; height: 100%; object-fit: cover; }
  .svc-info { margin-left: 12px; display: flex; flex-direction: column; justify-content: space-between; }
  .svc-meta { gap: 6px; }
  /* 预约 */
  .days { display: flex; gap: 8px; overflow: hidden; }
  .day { width: 66px; padding: 9px 0; border-radius: 10px; background: #F8F4F1; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; font-size: 13px; cursor: pointer; }
  .day.active { background: var(--brand); color: #fff; }
  .day .week { font-size: 10px; opacity: .8; margin-top: 2px; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .slot { width: calc((100% - 24px)/4); height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: #F8F4F1; font-size: 13px; cursor: pointer; }
  .slot.active { background: var(--brand-soft); border: 1px solid var(--brand); color: var(--brand-deep); font-weight: 600; }
  .slot.disabled { background: #F3F3F3; color: var(--ink-3); text-decoration: line-through; cursor: not-allowed; }
  .picked { background: var(--brand-soft); border-radius: 10px; padding: 12px; }
  /* 会员卡 */
  .mcard { border-radius: 14px; padding: 20px 18px; background: linear-gradient(135deg,#333333 0%,#171717 55%,#262626 100%); color: #fff; box-shadow: 0 7px 16px rgba(0,0,0,.28); position: relative; overflow: hidden; }
  .mcard-bg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  .mcard > *:not(.mcard-bg) { position: relative; }
  .mcard-label { font-size: 11px; opacity: .8; }
  .mcard-balance { font-size: 38px; font-weight: 700; line-height: 1.2; }
  .mcard-balance .unit { font-size: 15px; }
  .mcard-chip { width: 44px; height: 44px; border-radius: 13px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; }
  .mcard-foot { margin-top: 18px; font-size: 12px; opacity: .92; }
  .progress-wrap { display: flex; align-items: center; gap: 10px; margin: 10px 0 6px; }
  .progress { flex: 1; height: 6px; border-radius: 3px; background: #F1E7E5; overflow: hidden; }
  .progress-in { height: 100%; border-radius: 3px; background: linear-gradient(90deg,#333333,#171717); }
  /* 记录 */
  .rec { display: flex; align-items: flex-start; }
  .rec + .rec { margin-top: 10px; }
  .rec-info { margin: 0 10px; }
  .rec-amount { font-size: 15px; }
  /* 抽奖 */
  .lottery-hero { text-align: center; padding-top: 12px; }
  .lottery-title { font-size: 22px; font-weight: 700; }
  .lottery-sub { font-size: 12px; color: var(--ink-2); margin-top: 6px; padding: 0 30px; }
  .cards { display: flex; justify-content: center; gap: 24px; margin-top: 30px; }
  .flip { width: 130px; height: 180px; perspective: 800px; cursor: pointer; }
  .flip-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.4,.1,.2,1); }
  .flip.open .flip-inner { transform: rotateY(180deg); }
  .face { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; backface-visibility: hidden; box-shadow: 0 8px 16px rgba(122,80,80,.18); }
  .face.back { background: linear-gradient(150deg,#D08E98 0%,#171717 60%,#A05A66 100%); color: #fff; }
  .face-logo { width: 60px; height: 60px; border-radius: 18px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; }
  .face-tip { font-size: 11px; opacity: .85; margin-top: 10px; }
  .face.front { transform: rotateY(180deg); color: #fff; }
  .face.front.win { background: linear-gradient(150deg,#D4AF7A,#525252); }
  .face.front.miss { background: linear-gradient(150deg,#B8B2B0,#8F8886); }
  .face-name { font-size: 14px; font-weight: 600; margin-top: 10px; padding: 0 10px; text-align: center; }
  /* 奖品 */
  .prize { display: flex; align-items: flex-start; }
  .prize + .prize { margin-top: 10px; }
  .prize-info { margin-left: 10px; }
  .prize-foot { margin-top: 6px; }
  /* 个人 */
  .avatar { width: 54px; height: 54px; border-radius: 50%; background: var(--brand-soft); display: flex; align-items: center; justify-content: center; color: var(--brand); flex-shrink: 0; }
  .user-balance { text-align: center; padding: 6px 12px; background: var(--brand-soft); border-radius: 10px; cursor: pointer; }
  .user-balance-num { color: var(--brand-deep); font-weight: 700; font-size: 16px; }
  .user-balance-label { font-size: 10px; color: var(--ink-3); }
  .role-tag { margin-left: 6px; }
  .tag.preview-tag { background: rgba(183,110,121,.12); color: #262626; margin-left: 6px; }
  /* ===== 设置页：身份切换 ===== */
  .role-opt { display: flex; align-items: center; padding: 12px 6px; border-radius: 12px; cursor: default; }
  .role-opt + .role-opt { margin-top: 2px; }
  .role-opt.cur { background: #FDF7F4; }
  .role-opt .role-name { font-size: 14px; font-weight: 500; color: var(--ink); }
  .role-opt .role-desc { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .role-opt .tag { margin-right: 6px; }
  .role-opt.disabled { opacity: .42; }
  .set-danger { color: var(--bad); }
  .set-note { text-align: center; font-size: 11px; color: var(--ink-3); padding: 14px 40px 4px; line-height: 1.7; }
  /* 店员 */
  .stats { display: flex; }
  .stat { flex: 1; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--brand-deep); }
  .stat-label { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
  .mem { display: flex; align-items: center; }
  .mem + .mem { margin-top: 10px; }
  .mem-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--brand-soft); display: flex; align-items: center; justify-content: center; color: var(--brand); flex-shrink: 0; }
  .mem-info { margin: 0 10px; }
  .mp-search { display: flex; align-items: center; background: #F8F4F1; border-radius: 20px; height: 40px; padding: 0 14px; gap: 7px; color: var(--ink-3); }
  .mp-selected { background: var(--brand-soft); border-radius: 10px; padding: 12px; }
  .switch { width: 44px; height: 26px; border-radius: 13px; background: #E8DCD8; position: relative; flex-shrink: 0; cursor: pointer; }
  .switch::after { content: ''; position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .switch.on { background: var(--brand); }
  .switch.on::after { left: 20px; }

/* Reference-led monochrome refresh */
body { background:#ededed; color:#171717; }
aside { background:#fff; border-color:#ddd; }
aside .sub, aside .group { color:#777; }
aside h1 { color:#111; }
aside button { color:#555; min-height:36px; }
aside button:hover { background:#f2f2f2; color:#111; }
.screen-title { color:#666; }
.phone { box-shadow:0 24px 70px #0002; }
.card { border:1px solid #eaeaea; border-radius:14px; box-shadow:none; }
.section { margin-top:22px; }
.section-title { letter-spacing:1px; font-size:17px; }
.hero { background:#151515; border-radius:20px; padding:24px 18px; box-shadow:none; }
.hero .img-ph { background:#151515; }
.hero-name { font-family:'Songti SC',serif; font-size:32px; font-weight:500; }
.hero-logo { border-radius:50%; background:transparent; }
.hero-actions { margin-top:20px; }
.hero-btn { min-height:44px; }

  home: 'home', services: 'scissors', appointments: 'calendar', lottery: 'gift', profile: 'user',
  'staff-home': 'briefcase', 'staff-orders': 'ticket', 'boss-home': 'chart', 'boss-payroll': 'coin', 'boss-finance': 'list'

function renderNav() {
  const MAP = { '顾客端': 'nav-customer', '店员端': 'nav-staff', '老板端': 'nav-boss' }
  Object.keys(NAV).forEach(g => {
    const box = document.getElementById(MAP[g])
    NAV[g].forEach(n => {
      const b = document.createElement('button')
      b.textContent = n[1]; b.dataset.key = n[0]
      b.onclick = () => show(n[0])
      box.appendChild(b)
    })
  })
}

function show(key) {
  CURRENT = key
  document.querySelectorAll('aside button').forEach(b => b.classList.toggle('active', b.dataset.key === key))
  document.getElementById('screenTitle').textContent = TITLES[key] || ''
  document.getElementById('screen').innerHTML = (S[key] || (() => ''))()
  document.getElementById('screen').scrollTop = 0
  const tb = document.getElementById('tabbar')
  const conf = ROLE_DOCK[ROLE]
  if (PAGE_ICON[key] && conf.pages.indexOf(key) > -1) {
    tb.innerHTML = tabbar(PAGE_ICON[key]); tb.style.display = 'flex'
  } else {
    tb.style.display = 'none'
  }
}

renderNav()
show((location.hash || '').replace('#', '') || 'home')
window.addEventListener('hashchange', () => {
  const k = (location.hash || '').replace('#', '')
  if (k) show(k)
})
