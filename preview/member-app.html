<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可樂 · 消息</title><style>@font-face{font-family:MiSans;src:url("assets/fonts/MiSans-Regular.ttf") format("truetype");font-weight:400;font-display:swap}@font-face{font-family:MiSans;src:url("assets/fonts/MiSans-Medium.ttf") format("truetype");font-weight:500 700;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#e9e2d8;color:#38261c;font-family:MiSans,-apple-system,'PingFang SC',sans-serif}button{font:inherit;color:inherit;cursor:pointer} .app{max-width:440px;min-height:100dvh;margin:auto;background:#faf6ee;position:relative;padding:22px 20px 115px;overflow:hidden}.lace{position:absolute;top:0;bottom:0;width:15px;opacity:.35;pointer-events:none;background:radial-gradient(ellipse at 0 50%,transparent 40%,#b99c7e 43%,transparent 49%) 0 0/15px 30px,radial-gradient(circle,#c7ac8b 1px,transparent 2px) 0 0/6px 6px}.lace.left{left:0}.lace.right{right:0;transform:rotate(180deg)}header{display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:600}header button{border:1px solid #ddcbb7;border-radius:30px;background:transparent;padding:10px 14px}.brand{text-align:center;padding:35px 0 15px}.logo{font:italic 40px Georgia,serif}.en{font:10px Georgia;letter-spacing:5px;margin:10px}.brand h1{font:25px 'Songti SC',serif;margin:22px 0 8px}.orn{color:#baa286;font-size:20px}.toolbar{text-align:right;margin:15px 0}.toolbar button{border:0;background:none;font-size:13px;padding:10px}.filters{display:flex;gap:6px;margin-bottom:22px;overflow:auto}.filters button{white-space:nowrap;flex:1;border:1px solid #b49a81;background:transparent;border-radius:30px;font-size:12px;padding:12px 9px}.filters .on{background:#432c1c;color:#fff6e6}.card{width:100%;text-align:left;display:block;background:linear-gradient(120deg,#fffaf2,#f5ecdf);border:1px solid #d6bea5;border-radius:18px;padding:20px 16px;margin-bottom:14px;box-shadow:0 4px 10px #69451f08}.row{display:flex;gap:12px;align-items:flex-start}.icon{font-size:25px;width:30px;flex-shrink:0}.content{flex:1;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:6px}.title{font-size:16px;font-weight:600}.date{font-size:11px;color:#88796a;white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#70472a;margin-left:5px}.card p{font-size:13px;line-height:1.8;margin:10px 0 13px;color:#766353}.link{border-top:1px solid #e1d0bd;padding-top:11px;font-size:12px;display:block;text-align:right}.help{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid #d6bea5;border-radius:16px;background:transparent;padding:18px;margin-top:20px}.help small{display:block;font-size:11px;color:#968573;margin-top:5px}.note{text-align:center;font-size:10px;color:#a19383;margin:20px 0}.nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 32px));display:flex;justify-content:space-around;border-radius:40px;background:linear-gradient(110deg,#2f2118,#563b27);padding:9px;box-shadow:0 8px 22px #35231326;z-index:4}.nav button{border:0;background:transparent;color:#f8eddb;font-size:11px;min-width:58px}.nav span{display:block;font-size:21px;width:36px;height:36px;line-height:36px;margin:auto auto 3px}.nav .active span{background:#f9efdd;color:#422b1b;border-radius:50%}dialog{border:1px solid #ccb397;border-radius:22px;background:#fcf7ef;color:#38261c;width:min(370px,90%);padding:27px}dialog::backdrop{background:#26170da0;backdrop-filter:blur(4px)}dialog p{line-height:1.9;font-size:14px;color:#796554}dialog button{background:#432c1c;color:#fff5e6;border:0;padding:13px 25px;border-radius:25px;width:100%}.empty{text-align:center;padding:45px;color:#95816a}.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#432c1c;color:#fff;padding:12px 20px;border-radius:30px;z-index:9;font-size:13px;display:none}
.member{background:linear-gradient(125deg,#251a14,#563b29);color:#fff0da;border-radius:22px;padding:26px;margin:22px 0;border-left:12px double #cfb998;box-shadow:0 8px 18px #49332118}.member h2{font-family:'Songti SC',serif;letter-spacing:4px}.balance{font:42px Georgia;margin:15px 0}.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.shortcuts .card{padding:17px 4px;font-size:12px;text-align:center}.surprise{text-align:center}.surprise h1{font-family:'Songti SC',serif;font-size:30px}.envelope{font-size:110px;color:#f4e5cc;text-shadow:0 10px 20px #0005}.surprise button{background:#f5e8d4;border:0;border-radius:30px;padding:15px 25px}.surprise a{font-size:12px;text-decoration:underline;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid img{width:100%;border-radius:10px}.grid .card{padding:10px}.grid h3{font-size:14px}.grid button{background:transparent;border:1px solid #bea489;border-radius:20px;padding:9px}h1{font-size:24px}button:active{transform:scale(.98)}
/* Real embroidered lace artwork */
.app{isolation:isolate;background:#faf6ee;}
.app::before,.app::after{content:"";position:absolute;top:0;bottom:0;width:52px;background-image:url("assets/brand/lace.png");background-size:110px auto;background-repeat:repeat-y;opacity:.7;pointer-events:none;z-index:-1;}
.app::before{left:-14px;background-position:left top;}

.member::after{content:"";position:absolute;left:0;top:0;bottom:0;width:90px;background:url("assets/brand/lace.png") left center/145px auto repeat-y;pointer-events:none;}

</style><main class="app"><div class="lace left"></div><div class="lace right"></div><header><button onclick="go('首页')" aria-label="返回">‹</button>消息<button onclick="openInfo('可樂','会员消息中心 · 界面演示')">•••</button></header><section class="brand"><div class="logo">KeLe ❦</div><div class="en">LETTERS TO YOU</div><h1>每一份关心，都有回音</h1><div class="orn">── ❧ ──</div></section><div class="toolbar"><button onclick="readAll()">✓ 全部已读</button></div><div class="filters" id="filters"></div><section id="list"></section><button class="help" onclick="openInfo('联系门店','如需咨询优惠或安排到店时间，请通过您已有的门店微信联系店员。此页面为本地交互演示，未连接客服服务。')"><div>♧　联系门店<small>　　有疑问，随时与我们联系</small></div>›</button><p class="note">消息仅展示门店通知与账户动态 · 演示数据</p></main><nav class="nav"><button onclick="go('首页')"><span>⌂</span>首页</button><button onclick="go('礼遇')"><span>♧</span>礼遇</button><button class="active" onclick="go('消息')"><span>☏</span>消息</button><button onclick="openInfo('我的','林小姐 · 可樂会员\n账户余额：¥1,280.00\n积分：320　优惠券：3张\n以上为演示数据。')"><span>♙</span>我的</button></nav><dialog id="modal"><h2 id="mt"></h2><p id="md" style="white-space:pre-line"></p><button onclick="modal.close()">知道了</button></dialog><div class="toast" id="toast"></div><script>
const data=[{id:1,type:'门店留言',icon:'☏',title:'可樂门店',date:'今天 10:30',body:'林小姐，您喜欢的可可色系已更新，欢迎来看看。',action:'查看留言'},{id:2,type:'会员通知',icon:'♧',title:'一份新的会员礼遇',date:'今天 09:00',body:'您有一封蕾丝秘笺待开启，去看看这份小惊喜。',action:'查看礼遇'},{id:3,type:'账户提醒',icon:'☷',title:'消费提醒',date:'昨天 16:20',body:'您的美甲消费已记录，余额变动可在消费记录中查看。\n项目：法式蕾丝美甲\n实付：¥168.00（演示数据）',action:'查看记录'},{id:4,type:'会员通知',icon:'▱',title:'优惠券即将到期',date:'11月01日',body:'您有1张优惠券将于11月15日到期，使用条件请查看卡券详情。',action:'查看卡券'}];let read;try{read=JSON.parse(localStorage.getItem('kele-read')||'[4]')}catch{read=[4]}let current='全部';function save(){localStorage.setItem('kele-read',JSON.stringify(read))}function setFilter(v){current=v;render()}function render(){let n=data.filter(x=>!read.includes(x.id)).length;document.getElementById('filters').innerHTML=['全部','门店留言','会员通知','账户提醒'].map(t=>`<button class="${current===t?'on':''}" onclick="setFilter('${t}')">${t}${t==='全部'&&n?' '+n:''}</button>`).join('');document.getElementById('list').innerHTML=data.filter(x=>current==='全部'||x.type===current).map(x=>`<button class="card" onclick="detail(${x.id})"><div class="row"><div class="icon">${x.icon}</div><div class="content"><div class="top"><span class="title">${x.title}</span><span class="date">${x.date}${!read.includes(x.id)?'<i class="dot"></i>':''}</span></div><p>${x.body.split('\n')[0]}</p><span class="link">${x.action}　›</span></div></div></button>`).join('')}function openInfo(t,b){document.getElementById('mt').textContent=t;document.getElementById('md').textContent=b;document.getElementById('modal').showModal()}function detail(id){let x=data.find(x=>x.id===id);if(!read.includes(id)){read.push(id);save()}render();openInfo(x.title,x.date+'\n\n'+x.body)}function readAll(){read=data.map(x=>x.id);save();render();let t=document.getElementById('toast');t.textContent='所有消息已标记为已读';t.style.display='block';setTimeout(()=>t.style.display='none',2000)}document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});render();

const originalMain=document.querySelector('main').innerHTML;
const base=()=>'<div class="brand"><div class="logo">KeLe ❦</div><div class="en">NAIL ATELIER</div></div>';
const btn=(t,f)=>`<button class="card" onclick="${f}">${t}　›</button>`;
const card=()=>`<section class="member"><h2>可樂会员</h2><small>VIP MEMBER</small><p>林小姐</p><small>账户余额</small><div class="balance">¥ 1,280.00</div><p>积分 320　｜　优惠券 3张</p></section>`;
function go(page){let main=document.querySelector('main');document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',['首页','礼遇','消息','我的'][i]===page));if(page==='消息'){main.innerHTML=originalMain;render();return}let body='';if(page==='首页')body=base()+card()+`<div class="shortcuts">${['我的卡包','选款','会员礼遇','消费记录'].map(x=>btn(x,`go('${x}')`)).join('')}</div>`+surprise()+btn('门店消息',"go('消息')");else if(page==='礼遇'||page==='会员礼遇')body=base()+'<h1>会员礼遇</h1>'+surprise()+btn('生日宠爱礼',"openInfo('生日宠爱礼','生日月可联系门店领取专属心意，具体权益以门店活动为准。')")+btn('已领取礼遇',"go('我的卡包')");else if(page==='我的卡包')body=card()+`<div class="filters">${['优惠券','项目卡','礼遇'].map(x=>`<button onclick="wallet('${x}')">${x}</button>`).join('')}</div><div id="wallet"></div>`;else if(page==='消费记录')body='<h1>消费记录</h1><section class="member">本月消费<div class="balance">¥ 526.00</div>共3笔 · 2026年11月</section>'+['法式蕾丝美甲|168','可可丝绒美甲|198','经典纯色美甲|160'].map((v,i)=>{let [n,a]=v.split('|');return btn(`<small>11月0${i?1:2}日 · 已完成</small><h3>${n}<span style="float:right">−¥${a}</span></h3>余额支付`, `openInfo('${n}','实付 ¥${a}\n支付方式：会员余额\n门店：可樂\n本记录为演示数据')`)}).join('');else if(page==='选款')body='<h1>选款</h1><div class="filters">'+['全部','美甲','美睫'].map(x=>`<button onclick="styles('${x}')">${x}</button>`).join('')+'</div><div id="styles" class="grid"></div>';else body=base()+'<h1>林小姐</h1><p style="text-align:center">可樂会员 · 138****0628</p>'+card()+['我的卡包','消费记录','充值记录','收藏款式','联系门店'].map(x=>btn(x,x==='我的卡包'||x==='消费记录'?`go('${x}')`:`openInfo('${x}','${x==='充值记录'?'10月20日 · 门店充值 ¥1,000.00（演示）':x==='收藏款式'?'收藏的款式会在这里展示，可在选款页试用收藏。':'请通过门店微信联系店员安排到店服务。'}')`)).join('');main.innerHTML=`<header><button onclick="go('首页')">‹</button>`+page+'<span>•••</span></header>'+body+'<p class="note">可樂会员中心 · 本地演示数据</p>';if(page==='我的卡包')wallet('优惠券');if(page==='选款')styles('全部');window.scrollTo(0,0)}
function surprise(){return `<section class="member surprise"><h1>蕾丝秘笺</h1><small>A LITTLE SURPRISE</small><p>拆开一封，遇见今日的小幸运</p><div class="envelope">✉</div><button onclick="draw()">拆开我的惊喜 →</button><p><a onclick="openInfo('活动规则','本演示可体验一次拆封，礼遇结果为示例，不代表真实中奖。')">查看礼遇与规则</a></p></section>`}
function draw(){if(localStorage.getItem('kele-gift'))return openInfo('今日秘笺已开启','您领取的手部护理体验已存入我的卡包。');localStorage.setItem('kele-gift','1');openInfo('秘笺已展开 ✧','获得：手部护理体验一份（演示）\n已放入我的卡包，到店请由店员核销。')}
function wallet(t){let items=t==='优惠券'?['¥30 美甲专属抵用券｜满168元可用','8.8折 会员焕新礼｜指定项目可用','赠礼 手部护理体验｜到店出示']:t==='项目卡'?['手部护理项目卡｜剩余3次']:localStorage.getItem('kele-gift')?['秘笺礼遇 · 手部护理体验｜待使用']:['暂无已领取礼遇，去首页拆开秘笺'];document.getElementById('wallet').innerHTML=items.map(x=>btn(x,`openInfo('卡券详情','${x}\n有效期至2026年12月31日\n请到店出示，由店员核销。此为演示卡券。')`)).join('')}
function styles(type){document.getElementById('styles').innerHTML=['法式蕾丝','可可丝绒','奶油纯色','自然美睫'].filter((x,i)=>type==='全部'||(type==='美睫'?i===3:i!==3)).map((n,i)=>`<section class="card"><img alt="${n}" src="../miniprogram/images/services/${i===3?'svc_lash.jpg':'svc_nail.jpg'}"><h3>${n}</h3><button onclick="this.textContent=this.textContent==='已收藏'?'收藏款式':'已收藏'">收藏款式</button></section>`).join('')}
document.querySelector('.nav button:last-child').onclick=()=>go('我的');go('首页');
</script></html>
