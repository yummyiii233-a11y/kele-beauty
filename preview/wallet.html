let category=0,state=0;const groups=['优惠券 3','项目卡 1','礼遇 2'];const coupons=[['<small>¥</small>30','美甲专属抵用券','满168元可用','2026.12.31'],['8.8<small>折</small>','会员焕新礼','指定美甲项目可用','2026.12.15'],['赠礼','手部护理体验','到店出示，享一次温柔呵护','2026.12.31']];function render(){document.getElementById('categories').innerHTML=groups.map((n,i)=>'<button class="'+(i===category?'on':'')+'" onclick="category='+i+';state=0;render()">'+icon(['record','card','gift'][i])+n+'</button>').join('');document.getElementById('states').innerHTML=['可使用','已使用','已过期'].map((n,i)=>'<button class="'+(state===i?'on':'')+'" onclick="state='+i+';render()">'+n+(i===0?'（'+[3,1,2][category]+'）':'')+'</button>').join('');let data=category===0?coupons:category===1?[['3次','手部护理项目卡','剩余3次 · 到店出示','2026.12.31']]:[['赠礼','手部护理体验','到店出示，享一次温柔呵护','2026.12.31'],['礼遇','会员专属礼遇','具体权益请咨询门店','2026.12.31']];document.getElementById('tickets').innerHTML=state?'<div class="empty">暂无'+['','已使用','已过期'][state]+'卡券</div>':data.map((c,i)=>'<div class="ticket-shell"><article class="ticket"><i class="ticket-notch top"></i><i class="ticket-notch bottom"></i><i class="ticket-notch left"></i><i class="ticket-notch right"></i><div class="value">'+c[0]+'</div><div class="ticket-info"><h2>'+c[1]+'</h2><p>'+c[2]+'</p><p class="expiry">有效期至 '+c[3]+'</p></div><button class="detail" onclick="details('+i+')">查看详情</button></article></div>').join('');window.currentCards=data}function details(i){const c=currentCards[i];info(c[1],c[2]+'。有效期至 '+c[3]+'。到店出示，由店员核销。当前为参考图示例卡券。')}function info(t,d){document.getElementById('title').textContent=t;document.getElementById('description').textContent=d;document.getElementById('modal').showModal()}document.getElementById('nav').innerHTML=['首页','礼遇','消息','我的'].map((n,i)=>'<button class="'+(i===3?'active':'')+'" onclick="navigate('+i+')">'+icon(['home','gift','message','user'][i])+n+'</button>').join('');function navigate(i){if(i===3)return;location.href=i===0?'home.html':i===2?'messages.html':'benefits.html'}document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});render();
